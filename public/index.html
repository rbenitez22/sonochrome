<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonochrome</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Music and colour from number series: pi, e, the golden ratio, Nørgård's infinity series and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Theme tokens (shared with the Pi Notes prototype). */
:root {
  --bg: #f1f4f7; --panel: #ffffff; --ink: #12202f; --muted: #5b6b7b; --line: #d5dde5; --accent: #0b7a80;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c1722; --panel: #14222f; --ink: #e6edf3; --muted: #93a4b4; --line: #26394a; --accent: #3fc1c6; }
}
/* Page frame. */
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
/* Heading. */
h1 { font: 700 clamp(36px, 8vw, 56px)/1.05 var(--display); margin: 0 0 12px; }
h1 span { color: var(--accent); }
.lede { color: var(--muted); margin: 0 0 32px; max-width: 46ch; }
/* Series cards. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card .sym { font: 700 32px/1 var(--display); color: var(--accent); }
.card h2 { font: 500 17px/1.3 var(--display); margin: 10px 0 4px; }
.card p { font: 400 13px/1.4 var(--mono); color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Sono<span>chrome</span></h1>
  <p class="lede">Music and colour from number series. Pick a series, then hear it or see it.</p>
  <div class="cards" aria-label="Series">
    <div class="card"><div class="sym">π</div><h2>Pi</h2><p>Coming soon</p></div>
    <div class="card"><div class="sym">e</div><h2>Euler's number</h2><p>Coming soon</p></div>
    <div class="card"><div class="sym">φ</div><h2>Golden ratio</h2><p>Coming soon</p></div>
    <div class="card"><div class="sym">∞</div><h2>Nørgård's infinity series</h2><p>Coming soon</p></div>
  </div>
</main>
</body>
</html>
