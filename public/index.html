<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonochrome</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Music and colour from number series: pi, e, the golden ratio, Nørgård's infinity series and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Theme tokens (shared with the Pi Notes prototype). */
:root {
  --bg: #f1f4f7; --panel: #ffffff; --ink: #12202f; --muted: #5b6b7b; --line: #d5dde5; --accent: #0b7a80;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0c1722; --panel: #14222f; --ink: #e6edf3; --muted: #93a4b4; --line: #26394a; --accent: #3fc1c6; }
}
/* Page frame. */
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
/* Heading. */
h1 { font: 700 clamp(36px, 8vw, 56px)/1.05 var(--display); margin: 0 0 12px; }
h1 span { color: var(--accent); }
.lede { color: var(--muted); margin: 0 0 32px; max-width: 46ch; }
/* Series cards: each one links to its series' Music and Colour views. */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; transition: border-color 0.15s, transform 0.15s; }
.card:hover, .card:focus-within { border-color: var(--accent); transform: translateY(-2px); }
.card .sym { font: 700 32px/1 var(--display); color: var(--accent); }
.card h2 { font: 500 17px/1.3 var(--display); margin: 4px 0 0; }
.card .blurb { font-size: 14px; line-height: 1.45; color: var(--muted); margin: 0; }
.card .preview { font: 400 13px/1.4 var(--mono); color: var(--ink); margin: 4px 0 0; overflow-wrap: anywhere; min-height: 1.4em; }
.card .go { margin-top: auto; padding-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.card .go a { font: 500 13px/1 var(--mono); color: var(--accent); text-decoration: none; border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 12px; }
.card .go a:hover { border-color: var(--accent); }
.card .go a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nojs { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover, .card:focus-within { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Sono<span>chrome</span></h1>
  <p class="lede">Music and colour from number series. Pick a series, then hear it or see it.</p>
  <nav class="cards" id="cards" aria-label="Series">
    <noscript><p class="nojs">The series list needs JavaScript. You can still open π as <a href="play.html#pi">music</a> or <a href="play.html#pi/color">colour</a>, or Thue–Morse as <a href="play.html#thue-morse">music</a> or <a href="play.html#thue-morse/color">colour</a>.</p></noscript>
  </nav>
</main>
<script type="module" src="src/app/welcome.js"></script>
</body>
</html>
